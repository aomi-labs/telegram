# fly launch --no-deploy --copy-config ; then fly secrets set DATABASE_URL=... SERVICE_KEY=... PUBLIC_URL=https://<app>.fly.dev PUBLIC_WEB_URL=https://<web>.vercel.app
app = "aomi-telegram-worker"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"
  # Build context is the repository root so workspace packages are visible.
  # fly deploy --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile .

[env]
  PORT = "8790"
  TELEGRAM_API_BASE = "https://api.telegram.org"
  VERIFY_WEBHOOK_SECRET = "true"
  SCHEDULER_INTERVAL_MS = "60000"

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = false   # the scheduler must keep running
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"
